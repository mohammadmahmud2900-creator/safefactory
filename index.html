<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeFactory - سلامة المصنع</title>
<style>
body{font-family:Arial;background:#f2f4f7;margin:0;text-align:center}
header{background:#0f766e;color:white;padding:40px 20px}
header h1{margin:0;font-size:32px}
header p{font-size:18px}
.box{background:white;margin:20px;padding:20px;border-radius:15px;box-shadow:0 2px 10px #ddd}
button{background:#0f766e;color:white;border:none;padding:15px 25px;font-size:18px;border-radius:10px;width:90%}
</style>
</head>
<body>
<header>
<h1>SafeFactory</h1>
<p>نظام سلامة المصنع - أمانك أولاً</p>
</header>
<div class="box">
<h2>حالة السلامة اليوم</h2>
<p>كل الأنظمة تعمل بشكل آمن</p>
<p>الحرارة: 24 | التهوية: جيدة</p>
</div>
<div class="box">
<h2>الإبلاغ عن خطر</h2>
<p>شفت اشي خطر في المصنع؟ بلغ فوراً</p>
<button onclick="alert('تم استلام بلاغك! شكراً لك')">ابلغ عن خطر الآن</button>
</div>
<div class="box">
<h2>تعليمات السلامة</h2>
<p>1. البس الخوذة دائماً</p>
<p>2. لا تقترب من الآلات المتحركة</p>
<p>3. اعرف مكان طفاية الحريق</p>
</div>
</body>
</html>
